<main class="page-content" data-page-content style="height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #080D18; overflow: hidden;">

    <div id="grokbot-intro" style="width: 100%; max-width: 600px; padding: 2rem; font-family: monospace; position: relative;">
        
        <!-- Header Terminal -->
        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; position: relative;">
            <span style="color: #eab308; font-weight: bold; font-size: 1.1rem;">GROKBOT OS v1.0</span>
            <span style="font-size: 0.8rem; color: #94a3b8;">INITIALIZING...</span>
        </div>

        <!-- AREA ANIMASI LABA-LABA 3D -->
        <div style="position: relative; height: 220px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px;">
            
            <!-- Jaring Laba-laba -->
            <div class="web-line-vertical"></div>
            <div class="web-line-horizontal"></div>

            <!-- Container Laba-laba -->
            <div class="spider-wrapper">
                <div class="spider">
                    <!-- Kaki Kiri -->
                    <div class="leg left-leg-1"></div>
                    <div class="leg left-leg-2"></div>
                    <div class="leg left-leg-3"></div>
                    <div class="leg left-leg-4"></div>
                    
                    <!-- Kaki Kanan -->
                    <div class="leg right-leg-1"></div>
                    <div class="leg right-leg-2"></div>
                    <div class="leg right-leg-3"></div>
                    <div class="leg right-leg-4"></div>

                    <!-- Badan Laba-laba -->
                    <div class="spider-body">
                        <div class="spider-head"></div>
                        <div class="spider-abdomen"></div>
                        <!-- Mata -->
                        <div class="eye eye-left"></div>
                        <div class="eye eye-right"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Log Animasi -->
        <div id="terminal-logs" style="display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; min-height: 80px; z-index: 10; position: relative;">
            <!-- Teks akan dimunculkan lewat JavaScript -->
        </div>

        <!-- Progress Bar -->
        <div style="margin-top: 30px; z-index: 10; position: relative;">
            <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: #ffffff; transition: width 0.3s ease;"></div>
            </div>
            <div style="text-align: right; font-size: 0.75rem; color: #94a3b8; margin-top: 5px;" id="progress-text">0%</div>
        </div>

    </div>
    
    <style>
        /* Latar Jaring */
        .web-line-vertical {
            position: absolute;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #3b82f6, transparent);
            opacity: 0.2;
        }
        .web-line-horizontal {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #3b82f6, transparent);
            opacity: 0.2;
        }

        /* Animasi Laba-laba Turun Naik */
        .spider-wrapper {
            animation: bounce 3s ease-in-out infinite alternate;
            position: relative;
            z-index: 2;
        }

        @keyframes bounce {
            0% { transform: translateY(-20px); }
            100% { transform: translateY(20px); }
        }

        .spider {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Badan Laba-laba */
        .spider-body {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bodyPulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes bodyPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Kepala (Bola 3D) */
        .spider-head {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
            position: absolute;
            top: 5px;
        }

        /* Perut (Bola 3D lebih besar) */
        .spider-abdomen {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1e3a8a);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            position: absolute;
            bottom: 0;
            z-index: -1;
        }

        /* Mata */
        .eye {
            width: 5px;
            height: 5px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 12px;
            box-shadow: 0 0 5px #ffffff;
        }
        .eye-left { left: 18px; }
        .eye-right { right: 18px; }

        /* Kaki */
        .leg {
            position: absolute;
            width: 35px;
            height: 3px;
            background: linear-gradient(90deg, #60a5fa, transparent);
            border-radius: 3px;
            top: 50%;
            transform-origin: left center;
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
        }

        /* Kaki Kiri */
        .left-leg-1 { left: -25px; transform: rotate(30deg); animation: walkLeft 0.6s ease-in-out infinite alternate; }
        .left-leg-2 { left: -25px; transform: rotate(10deg); animation: walkLeft 0.6s ease-in-out infinite alternate-reverse; }
        .left-leg-3 { left: -25px; transform: rotate(-10deg); animation: walkLeft 0.6s ease-in-out infinite alternate; }
        .left-leg-4 { left: -25px; transform: rotate(-30deg); animation: walkLeft 0.6s ease-in-out infinite alternate-reverse; }

        /* Kaki Kanan */
        .right-leg-1 { right: -25px; transform: rotate(-30deg) scaleX(-1); transform-origin: right center; animation: walkRight 0.6s ease-in-out infinite alternate; }
        .right-leg-2 { right: -25px; transform: rotate(-10deg) scaleX(-1); transform-origin: right center; animation: walkRight 0.6s ease-in-out infinite alternate-reverse; }
        .right-leg-3 { right: -25px; transform: rotate(10deg) scaleX(-1); transform-origin: right center; animation: walkRight 0.6s ease-in-out infinite alternate; }
        .right-leg-4 { right: -25px; transform: rotate(30deg) scaleX(-1); transform-origin: right center; animation: walkRight 0.6s ease-in-out infinite alternate-reverse; }

        /* Animasi Kaki Berjalan */
        @keyframes walkLeft {
            0% { transform: rotate(20deg); }
            100% { transform: rotate(40deg); }
        }
        @keyframes walkRight {
            0% { transform: rotate(-20deg) scaleX(-1); }
            100% { transform: rotate(-40deg) scaleX(-1); }
        }
    </style>
</main>
