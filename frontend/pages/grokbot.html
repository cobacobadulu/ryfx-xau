<main class="page-content" data-page-content style="height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #080D18; overflow: hidden;">

    <div id="grokbot-intro" style="width: 100%; max-width: 600px; padding: 2rem; font-family: monospace; position: relative;">
        
        <!-- Header Terminal -->
        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; position: relative;">
            <!-- Nama GROKBOT jadi KUNING -->
            <span style="color: #eab308; font-weight: bold; font-size: 1.1rem;">ryGROKBOT OS v1.0</span>
            <span style="font-size: 0.8rem; color: #94a3b8;">INITIALIZING...</span>
        </div>

        <!-- AREA ANIMASI AI SWARM (LOGO BERPUTAR) -->
        <div style="position: relative; height: 220px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px;">
            
            <!-- Garis Orbit -->
            <div class="orbit"></div>
            
            <!-- Inti Grokbot (Tengah) -->
            <div style="position: absolute; z-index: 5; background: #080D18; border: 2px solid #3b82f6; width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite;">
                <span style="color: #ffffff; font-weight: bold; font-size: 1.5rem;">G</span>
            </div>

            <!-- Logo AI 1 (OpenAI) -->
            <div class="ai-node" style="animation-delay: 0s;">
                <svg viewBox="0 0 24 24" fill="#10a37f" width="20" height="20"><path d="M22.28 11.2c-.16-1.3-1.6-2.2-2.9-1.8-.1-1.1-1.1-2-2.2-1.9-.5-1-1.6-1.5-2.7-1.3-.8-.8-2-.9-2.9-.2-.7-.9-1.9-1.1-2.8-.5-.4-.6-1.2-.9-1.9-.7-.7.2-1.2.8-1.2 1.5-1 .2-1.7 1.1-1.7 2.1 0 .3.1.6.2.9-.8.4-1.3 1.2-1.3 2.1 0 .5.2 1 .5 1.4-.6.5-1 1.3-.9 2.2.1.8.6 1.5 1.4 1.8.1 1 1 1.8 2 1.9.4.9 1.4 1.4 2.4 1.2.7.8 1.9 1 2.8.4.4.6 1.2.9 1.9.7.7-.2 1.2-.8 1.2-1.5 1-.2 1.7-1.1 1.7-2.1 0-.3-.1-.6-.2-.9.8-.4 1.3-1.2 1.3-2.1 0-.5-.2-1-.5-1.4.6-.5 1-1.3.9-2.2zM12 17.5c-3 0-5.5-2.5-5.5-5.5s2.5-5.5 5.5-5.5 5.5 2.5 5.5 5.5-2.5 5.5-5.5 5.5z"/></svg>
            </div>
            
            <!-- Logo AI 2 (Gemini/Google) -->
            <div class="ai-node" style="animation-delay: -2s;">
                <svg viewBox="0 0 24 24" fill="#4285F4" width="20" height="20"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            </div>
            
            <!-- Logo AI 3 (Grok/X) -->
            <div class="ai-node" style="animation-delay: -4s;">
                <svg viewBox="0 0 24 24" fill="#ec4899" width="20" height="20"><path d="M12 2L2 22h20L12 2zm0 3.8L18.5 19h-13L12 5.8z"/></svg>
            </div>
        </div>

        <!-- Log Animasi -->
        <div id="terminal-logs" style="display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; min-height: 80px; z-index: 10; position: relative;">
            <!-- Teks akan dimunculkan lewat JavaScript -->
        </div>

        <!-- Progress Bar -->
        <div style="margin-top: 30px; z-index: 10; position: relative;">
            <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden;">
                <!-- Loading Bar jadi PUTIH -->
                <div id="progress-bar" style="width: 0%; height: 100%; background: #ffffff; transition: width 0.3s ease;"></div>
            </div>
            <div style="text-align: right; font-size: 0.75rem; color: #94a3b8; margin-top: 5px;" id="progress-text">0%</div>
        </div>

    </div>
    
    <style>
        /* CSS Animasi AI Swarm */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .orbit {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px dashed #334155;
            border-radius: 50%;
        }

        .ai-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
            animation: orbit 6s linear infinite; 
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(90px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(90px) rotate(-360deg); }
        }
    </style>
</main>
