<style>

}

.trading-grid {

.candle-container {

.candle {

    top:var(--y);
    width:7px;
    height:var(--h);
    border-radius:1px;
    animation:candleMove 4s ease-in-out infinite alternate;
}

.candle::before {
    content:"";
    position:absolute;
    left:2px;
    top:calc((var(--h) - var(--wick))/2);
    width:2px;
    height:var(--wick);
    background:inherit;
    opacity:.8;
}

.candle.green {
    background:#00d99a;
    box-shadow:0 0 12px rgba(0,217,154,.35);
}

.candle.red {

}

}

.leg-three {right:14px;top:76px;animation:walk .5s .25s infinite alternate;}

/* ANIMATIONS */
@keyframes turtleWalk {
    0%,100% {
        transform:translate(-35px,0) rotate(-3deg);

    25% {
        transform:translate(0,-10px) rotate(2deg);
    }
    50% {
        transform:translate(35px,0) rotate(3deg);
    }
    75% {
        transform:translate(0,-10px) rotate(-2deg);
    }
}

@keyframes headMove {
    0%,100% {transform:rotate(0deg);}
    50% {transform:rotate(5deg) translateY(-2px);}
}

@keyframes walk {
    from {transform:translateY(0) rotate(-8deg);}
    to {transform:translateY(4px) rotate(8deg);}
}

@keyframes auraPulse {
    0%,100% {transform:scale(.92);opacity:.4;}
    50% {transform:scale(1.08);opacity:1;}
}

@keyframes shadowPulse {
    0%,100% {transform:scale(1);opacity:.5;}
    50% {transform:scale(.8);opacity:.25;}
}

@keyframes candleMove {
    from {opacity:.35;transform:translateY(8px);}
    to {opacity:.9;transform:translateY(-8px);}
}

@keyframes priceMove {
    from {transform:translateY(-20px);opacity:.2;}
    to {transform:translateY(20px);opacity:.7;}
}

/* MOBILE */
@media(max-width:480px) {
    #grokbot-intro {padding:1.5rem;}
    .turtle-stage {height:220px;}
    .candle {width:5px;}
    .chart-label {font-size:8px;}
}

/* ACCESSIBILITY */
@media(prefers-reduced-motion:reduce) {
    .turtle,.turtle-head,.leg,.turtle-aura,
    .turtle-shadow,.candle,.price-line {
