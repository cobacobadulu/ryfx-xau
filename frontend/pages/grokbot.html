<main class="page-content" data-page-content style="height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #080D18; overflow: hidden;">

    <div id="grokbot-intro" style="width: 100%; max-width: 600px; padding: 2rem; font-family: monospace; position: relative;">
        
        <!-- Header Terminal -->
        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; position: relative;">
            <span style="color: #eab308; font-weight: bold; font-size: 1.1rem;">GROKBOT OS v1.0</span>
            <span style="font-size: 0.8rem; color: #94a3b8;">INITIALIZING...</span>
        </div>

        <!-- AREA ANIMASI LABA-LABA -->
        <div style="position: relative; height: 220px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px;">
            
            <!-- Jaring Laba-laba (Garis Halus) -->
            <svg style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; opacity: 0.1;">
                <line x1="50%" y1="0" x2="50%" y2="100%" stroke="#3b82f6" stroke-width="1"/>
                <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#3b82f6" stroke-width="1"/>
            </svg>

            <!-- Container Laba-laba (Animasi Turun) -->
            <div class="spider-container">
                <svg viewBox="0 0 100 100" width="80" height="80" class="spider-svg">
                    <!-- Kaki Kiri (Atas, Tengah, Bawah) -->
                    <path d="M 50 50 Q 30 30 10 40" class="leg leg-left-1" stroke="#3b82f6" stroke-width="3" fill="none"/>
                    <path d="M 50 50 Q 30 50 10 60" class="leg leg-left-2" stroke="#3b82f6" stroke-width="3" fill="none"/>
                    <path d="M 50 50 Q 30 70 10 80" class="leg leg-left-3" stroke="#3b82f6" stroke-width="3" fill="none"/>
                    
                    <!-- Kaki Kanan (Atas, Tengah, Bawah) -->
                    <path d="M 50 50 Q 70 30 90 40" class="leg leg-right-1" stroke="#3b82f6" stroke-width="3" fill="none"/>
                    <path d="M 50 50 Q 70 50 90 60" class="leg leg-right-2" stroke="#3b82f6" stroke-width="3" fill="none"/>
                    <path d="M 50 50 Q 70 70 90 80" class="leg leg-right-3" stroke="#3b82f6" stroke-width="3" fill="none"/>

                    <!-- Badan Laba-laba -->
                    <circle cx="50" cy="45" r="10" fill="#080D18" stroke="#3b82f6" stroke-width="3"/>
                    <circle cx="50" cy="60" r="14" fill="#080D18" stroke="#3b82f6" stroke-width="3"/>
                    
                    <!-- Mata -->
                    <circle cx="46" cy="42" r="2" fill="#ffffff" />
                    <circle cx="54" cy="42" r="2" fill="#ffffff" />
                </svg>
            </div>

        </div>

        <!-- Log Animasi -->
        <div id="terminal-logs" style="display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; min-height: 80px; z-index: 10; position: relative;">
            <!-- Teks akan dimunculkan lewat JavaScript -->
        </div>

        <!-- Progress Bar -->
        <div style="margin-top: 30px; z-index: 10; position: relative;">
            <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: #ffffff; transition: width 0.3s ease;"></div>
            </div>
            <div style="text-align: right; font-size: 0.75rem; color: #94a3b8; margin-top: 5px;" id="progress-text">0%</div>
        </div>

    </div>
    
    <style>
        /* Animasi Laba-laba Turun Naik */
        .spider-container {
            animation: slideDown 4s ease-in-out infinite alternate;
        }

        @keyframes slideDown {
            0% { transform: translateY(-30px); }
            100% { transform: translateY(30px); }
        }

        /* Animasi Kaki Merayap */
        .leg {
            transform-origin: 50px 50px;
            animation: crawl 0.5s ease-in-out infinite alternate;
        }

        /* Kaki kiri dan kanan bergantian agar terlihat merayap */
        .leg-left-1, .leg-right-2, .leg-left-3 {
            animation-direction: alternate-reverse;
        }

        @keyframes crawl {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }
    </style>
</main>
