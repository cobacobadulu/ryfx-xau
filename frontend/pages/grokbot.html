<main class="page-content" data-page-content style="height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #080D18; overflow: hidden; position: relative;">

    <!-- BACKGROUND CANDLESTICK -->
    <div class="trading-background">
        <div class="chart-grid"></div>
        <div class="candles">
            <i style="--x:3%;--h:65px;--b:30px;--c:#16a34a"></i>
            <i style="--x:9%;--h:90px;--b:42px;--c:#ef4444"></i>
            <i style="--x:15%;--h:55px;--b:24px;--c:#16a34a"></i>
            <i style="--x:21%;--h:110px;--b:55px;--c:#16a34a"></i>
            <i style="--x:27%;--h:75px;--b:35px;--c:#ef4444"></i>
            <i style="--x:33%;--h:120px;--b:60px;--c:#16a34a"></i>
            <i style="--x:39%;--h:85px;--b:40px;--c:#ef4444"></i>
            <i style="--x:45%;--h:100px;--b:50px;--c:#16a34a"></i>
            <i style="--x:51%;--h:65px;--b:30px;--c:#ef4444"></i>
            <i style="--x:57%;--h:130px;--b:65px;--c:#16a34a"></i>
            <i style="--x:63%;--h:80px;--b:38px;--c:#ef4444"></i>
            <i style="--x:69%;--h:105px;--b:52px;--c:#16a34a"></i>
            <i style="--x:75%;--h:70px;--b:32px;--c:#ef4444"></i>
            <i style="--x:81%;--h:115px;--b:57px;--c:#16a34a"></i>
            <i style="--x:87%;--h:85px;--b:40px;--c:#ef4444"></i>
            <i style="--x:93%;--h:125px;--b:62px;--c:#16a34a"></i>
        </div>
    </div>

    <div id="grokbot-intro" style="width: 100%; max-width: 600px; padding: 2rem; font-family: monospace; position: relative; z-index: 10;">
        
        <!-- Header Terminal -->
        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
            <span style="color: #eab308; font-weight: bold; font-size: 1.1rem;">GROKBOT OS v1.0</span>
            <span style="font-size: 0.8rem; color: #94a3b8;">INITIALIZING...</span>
        </div>

        <!-- AREA KURA-KURA -->
        <div style="position: relative; height: 150px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
            
            <!-- Kura-kura (menggunakan SVG sederhana yang dibentuk pakai div) -->
            <div class="turtle">
                <!-- Bayangan Kura-kura -->
                <div class="turtle-shadow"></div>
                
                <!-- Badan -->
                <div class="turtle-body" style="width: 60px; height: 40px; background: #22c55e; border-radius: 40px 40px 20px 20px; position: relative; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2); border: 2px solid #166534;">
                    <!-- Pola Tempurung -->
                    <div style="position: absolute; top: 5px; left: 15px; width: 10px; height: 10px; background: #166534; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 5px; right: 15px; width: 10px; height: 10px; background: #166534; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 18px; left: 25px; width: 10px; height: 10px; background: #166534; border-radius: 50%;"></div>
                </div>

                <!-- Kepala -->
                <div class="turtle-head" style="width: 25px; height: 25px; background: #4ade80; border-radius: 50%; position: absolute; top: -10px; right: -10px; border: 2px solid #166534; display: flex; justify-content: center; align-items: center;">
                    <!-- Mata -->
                    <div style="width: 4px; height: 4px; background: #000; border-radius: 50%; position: absolute; top: 8px; left: 6px;"></div>
                    <div style="width: 4px; height: 4px; background: #000; border-radius: 50%; position: absolute; top: 8px; right: 6px;"></div>
                </div>

                <!-- Kaki 1 -->
                <div class="leg-one" style="width: 12px; height: 15px; background: #4ade80; border-radius: 5px; position: absolute; bottom: -10px; left: 5px; border: 2px solid #166534;"></div>
                <!-- Kaki 2 -->
                <div class="leg-two" style="width: 12px; height: 15px; background: #4ade80; border-radius: 5px; position: absolute; bottom: -10px; right: 5px; border: 2px solid #166534;"></div>
                <!-- Kaki 3 (Belakang) -->
                <div class="leg-three" style="width: 12px; height: 15px; background: #4ade80; border-radius: 5px; position: absolute; bottom: -10px; left: 20px; border: 2px solid #166534;"></div>
                <!-- Kaki 4 (Belakang) -->
                <div class="leg-four" style="width: 12px; height: 15px; background: #4ade80; border-radius: 5px; position: absolute; bottom: -10px; right: 20px; border: 2px solid #166534;"></div>
            </div>
        </div>

        <!-- Log Animasi -->
        <div id="terminal-logs" style="display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; min-height: 100px;">
            <!-- Teks akan dimunculkan lewat JavaScript -->
        </div>

        <!-- Progress Bar -->
        <div style="margin-top: 30px;">
            <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: #ffffff; transition: width 0.3s ease;"></div>
            </div>
            <div style="text-align: right; font-size: 0.75rem; color: #94a3b8; margin-top: 5px;" id="progress-text">0%</div>
        </div>

    </div>
    
</main>
